<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>slides</title>
  <link rel="icon" href="data:,">
  <style>
    @media (prefers-color-scheme: light) { html, body { background: #fafafa; } .boot { color: #6b6f7a; } .spinner { background: conic-gradient(from 0deg, transparent 0 20%, #4078f2); } }
    /* the first paint, before the bundle and its stylesheet arrive */
    html, body { margin: 0; height: 100%; background: #1e1e2e; }
    .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #9aa3b2; font: 14px system-ui, sans-serif; }
    .spinner { width: 42px; height: 42px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 20%, #61afef); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"><div class="boot"><div class="spinner"></div></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
