name: Release
# Tag a version (git tag v0.1.0 && git push --tags) to build standalone `slides` binaries
# (the showcase deck, per platform) and attach them to a GitHub release.
# Run manually to get the binaries as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the showcase deck as an executable
        shell: bash
        run: node cli/slideit.mjs build examples/showcase -t exe -o slideit-showcase-${{ matrix.name }}
      - name: Sign (macOS ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --sign - slideit-showcase-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: slideit-showcase-${{ matrix.name }}
          path: slideit-showcase-${{ matrix.name }}*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
